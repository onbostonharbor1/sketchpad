<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drawing Tests</title>

  <style>
    html, body { margin: 0; padding: 0; background: #fff; }
    #wrap { position: absolute; top: 50px; left: 50px; }
    canvas { border: 0; }
  </style>
</head>

<body>
  <div id="wrap">
    <canvas id="sharedCanvas" width="1000" height="800"></canvas>
  </div>

  <!-- System bootstrap (assumed to set up window.ctx, canvas, etc.) -->
  <script type="module" src="/drawMain.js"></script>

  <script type="module">

// ------------------------------------------------------------
// Example usage (standalone test-style)
// ------------------------------------------------------------
import { drawParametric, buildParametricDomain, chooseNumPointsForFreq,
          autoFitParametricToCanvas } from "/draw/parametrics.js";
import { Parametric } from "/classes/parametric.js";

function runPattern() {


	let s = {

		funcX: function(t) { return 1.5 * Math.cos(t) + 0.5 * Math.sin(198 * t); },
		funcY: function(t) { return 1.5 * Math.sin(t) + 0.5 * Math.cos(201 * t); }
	};

	let thing = new Parametric(s);

	autoFitParametricToCanvas(thing, 600, 600, 20);

	drawParametric(thing);

} // end test


runPattern();
  </script>
</body>
</html>

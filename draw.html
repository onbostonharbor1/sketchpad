<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Draw (No UI)</title>

  <style>
    html, body { margin: 0; padding: 0; background: #fff; }
    #wrap { position: absolute; top: 50px; left: 50px; }
    canvas { border: 0; }
  </style>
</head>

<body>
  <div id="wrap">
    <canvas id="sharedCanvas" width="1000" height="800"></canvas>
  </div>

  <!-- System imports only -->
  <script type="module" src="/drawMain.js"></script>


  <script type="module">
  import { Point, StringThing }          from './classes/classes.js';
  import { drawMysticRose } from './draw/unicorns.js';

  runPattern();

  function runPattern () {
	  let s = { numNodes: 20,
		          color:    "blue",
		          midpoint: new Point(300,300),
              yScale:   1.1,
  //            ellipse:  { a: 400, b: 300 }
		          radius:   400
            };
	  let thing = new StringThing(s);
    drawMysticRose(thing);
  }

  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drawing Tests</title>

  <style>
    html, body { margin: 0; padding: 0; background: #fff; }
    #wrap { position: absolute; top: 50px; left: 50px; }
    canvas { border: 0; }
  </style>
</head>

<body>
  <div id="wrap">
    <canvas id="sharedCanvas" width="1000" height="800"></canvas>
  </div>

  <!-- System bootstrap (assumed to set up window.ctx, canvas, etc.) -->
  <script type="module" src="/drawMain.js"></script>

  <script type="module">

// ------------------------------------------------------------
// Example usage (standalone test-style)
// ------------------------------------------------------------

import { Line, Point }     from "/classes/classes.js";
import { CurveStitch }      from "/classes/curveStitchClass.js";
import { drawLine, ptsOnLine, printTitle } from "/draw/drawUtilities.js";

export function runPattern() {
    printTitle("Cloth-Style Interlace");

    let s = { numSteps: 20, lineWidth: 1.5 };
    let thing = new CurveStitch(s);

    // Define points for two overlapping parabolas
    const p1 = new Point(50, 50);
    const p2 = new Point(50, 350);
    const p3 = new Point(350, 350);
    const p4 = new Point(350, 50);

    // Parabola A (Blue - "Warp")
    const armA1 = ptsOnLine(thing, new Line(p1, p2));
    const armA2 = ptsOnLine(thing, new Line(p2, p3));
    let warp = [];
    for (let i = 0; i < armA1.length; i++) {
        warp.push({ start: armA1[i], end: armA2[armA2.length - 1 - i], color: "blue" });
    }

    // Parabola B (Green - "Weft")
    const armB1 = ptsOnLine(thing, new Line(p2, p3));
    const armB2 = ptsOnLine(thing, new Line(p3, p4));
    let weft = [];
    for (let i = 0; i < armB1.length; i++) {
        weft.push({ start: armB1[i], end: armB2[armB2.length - 1 - i], color: "green" });
    }

    // --- The Weaving Logic (Interleaving) ---
    // In cloth, we don't draw all of A then all of B.
    // We draw them in alternating segments or order.

    const maxLines = Math.max(warp.length, weft.length);

    for (let i = 0; i < maxLines; i++) {
        // Draw one "thread" from the Warp
        if (warp[i]) {
            // If i is even, Warp goes OVER (Masking)
            if (i % 2 === 0) drawWithMask(warp[i]);
            else drawLine(warp[i].start, warp[i].end, warp[i].color);
        }

        // Draw one "thread" from the Weft
        if (weft[i]) {
            // If i is odd, Weft goes OVER (Masking)
            if (i % 2 !== 0) drawWithMask(weft[i]);
            else drawLine(weft[i].start, weft[i].end, weft[i].color);
        }
    }

    function drawWithMask(l) {
        ctx.save();
        ctx.strokeStyle = "white";
        ctx.lineWidth = thing.lineWidth + 2;
        drawLine(l.start, l.end, "white");
        ctx.restore();
        drawLine(l.start, l.end, l.color);
    }
}

runPattern();
  </script>
</body>
</html>

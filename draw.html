<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drawing Tests</title>

  <style>
    html, body { margin: 0; padding: 0; background: #fff; }
    #wrap { position: absolute; top: 50px; left: 50px; }
    canvas { border: 0; }
  </style>
</head>

<body>
  <div id="wrap">
    <canvas id="sharedCanvas" width="1000" height="800"></canvas>
  </div>

  <!-- System bootstrap (assumed to set up window.ctx, canvas, etc.) -->
  <script type="module" src="/drawMain.js"></script>

  <script type="module">

// ------------------------------------------------------------
// Example usage (standalone test-style)
// ------------------------------------------------------------
import { Line, Point, StringThing } from "/classes/classes.js";
import { drawAParab }               from "/draw/drawRegular.js";

export function runPattern() {

  // --- Snapshot of current default params (JSON-safe) ---
  const p = {
    line1_pt1: { x: 20,  y: 20  },
    line1_pt2: { x: 20,  y: 300 },
    line1_midpoint: null,
    line2_pt1: { x: 20,  y: 300 },
    line2_pt2: { x: 300, y: 300 },
    line2_midpoint: null,
    color: "#008800",
    lineWidth: 2
  };

  // --- Build geometry from snapshot ---
  const l1 = new Line(
    new Point(p.line1_pt1.x, p.line1_pt1.y),
    new Point(p.line1_pt2.x, p.line1_pt2.y)
  );

  const m1 = l1.midpoint();
  p.line1_midpoint = new Point(m1.x, m1.y);

  const l2 = new Line(
    new Point(p.line2_pt1.x, p.line2_pt1.y),
    new Point(p.line2_pt2.x, p.line2_pt2.y)
  );

  const m2 = l2.midpoint();
  p.line2_midpoint = new Point(m2.x, m2.y);

  // --- Style + draw ---
  const thing = new StringThing({ color: p.color, lineWidth: p.lineWidth });
  drawAParab(thing, l1, l2);

} // end runPattern



runPattern();
  </script>
</body>
</html>

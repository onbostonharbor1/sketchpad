<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drawing Tests</title>

  <style>
    html, body { margin: 0; padding: 0; background: #fff; }
    #wrap { position: absolute; top: 50px; left: 50px; }
    canvas { border: 0; }
  </style>
</head>

<body>
  <div id="wrap">
    <canvas id="sharedCanvas" width="1000" height="800"></canvas>
  </div>

  <!-- System bootstrap (assumed to set up window.ctx, canvas, etc.) -->
  <script type="module" src="/drawMain.js"></script>

  <script type="module">
    /*
      draw.htm (root)
      Uses:
        - LinkedCircles class
        - drawLinkedCircles(thing)
      Preserves link modes:
        "pairwise" | "ring" | "allToAll"
    */

    import { LinkedCircles }     from "/classes/linkedCircles.js";
    import { drawLinkedCircles } from "/draw/drawLinkedCircles.js";

    // Create the draw-side object ("thing")
    const thing = new LinkedCircles({
      numCircles: 4,        // range: 2..7
      linkMode: "ring",     // "pairwise" | "ring" | "allToAll"
      radius: 100,
      numPoints: 120,
      numSteps: 6,
      color: "blue",
      lineWidth: 2
      // midpoints intentionally omitted
      // predefined midpoint set is selected automatically
    });

    // Draw once
    drawLinkedCircles(thing);

    // Uncomment to test other modes:
    // thing.setLinkMode("pairwise"); drawLinkedCircles(thing);
    // thing.setLinkMode("allToAll"); drawLinkedCircles(thing);
  </script>
</body>
</html>

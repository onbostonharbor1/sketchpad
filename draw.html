<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drawing Tests</title>

  <style>
    html, body { margin: 0; padding: 0; background: #fff; }
    #wrap { position: absolute; top: 50px; left: 50px; }
    canvas { border: 0; }
  </style>
</head>

<body>
  <div id="wrap">
    <canvas id="sharedCanvas" width="1000" height="800"></canvas>
  </div>

  <!-- System bootstrap (assumed to set up window.ctx, canvas, etc.) -->
  <script type="module" src="/drawMain.js"></script>

  <script type="module">

    import { Point, StringThing, Line } from "/classes/classes.js";
    import { createNodes, ptsOnLine, stitcher, drawLine, drawLines }
                                  from "/draw/draw_utilities.js";
    import { drawRegularPolygonTouch, drawInnerStar } from "/draw/drawRegular.js";
    import { crossHair }          from "/draw/unicorns.js";

    // drawing in square

function runPattern() {
	let s = { color:    "blue",
	          midpoint: new Point(250,250),
	          radius:   300,
	          numNodes: 4,
	          rotate:   45,
	          numSteps: 36
	        }
	let thing = new StringThing(s);
	let nodes = createNodes(thing);
	for (let i=0; i < nodes.length; i++) {
	    let j = (i+1) % nodes.length;
	    drawLine(nodes[i],nodes[j], "blue");
	}

	let arms = [];
	for (let i=0;i<nodes.length;i++) {
	    let j = (i+1) % nodes.length;
      let line = new Line(nodes[i],nodes[j]);
	    arms.push(ptsOnLine(thing,line));
	}
	let arm = arms[0];
	for (let i=1;i<arms.length;i++) {
	    arm = arm.concat(arms[i]);
	}
	arm = arm.concat(arm);
	for (let i=0; i<6*arms[0].length; i++) {
      drawLine(arm[i],
               arm[i+arms[0].length+18],
               "blue");
	}

}


runPattern();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sketchpad Layout</title>

    <!-- ===========================================================
       DIV STRUCTURE
       -----------------------------------------------------------
       wrapper
         ├── tabs
         └── content
              ├── control
              │     └── button
              │     └── action
              └── main
              |     ├── subtabs
              |     ├── caption
              |     ├── text
              |     └── sketchpad
              └── offcanvasPanel
                    ├── offcanvas-header
                    └── offcanvas=body


      overlayContainer
         ├── overlayBackground   (dimmed clickable backdrop)
         └── overlayPanel
               ├── overlayHeader
               │     ├── overlayTitle
               │     └── overlayClose (×)
               └── overlayContent     (HTML inserted dynamically)

               These nodes are recreated or cleared as subtabs change.
   ============================================================ -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/wrapper.css" />
    <link rel="stylesheet" href="./css/themes.css" />
    <link rel="stylesheet" href="./css/tabs.css" />
    <link rel="stylesheet" href="./css/categories.css" />
    <link rel="stylesheet" href="./css/offcanvas.css" />
    <link rel="stylesheet" href="./css/parameterControls.css" />
    <link rel="stylesheet" href="./css/overlay.css" />
    <link rel="icon" href="data:,">

  </head>
  <body>
    <div id="wrapper">
      <div id="tabs">
        <ul class="nav nav-tabs" id="mainTabs" role="tablist">
          <li class="nav-item" role="presentation">
             <button
                class="nav-link active"
               id="home-tab"
               data-bs-toggle="tab"
               data-bs-target="#home"
               type="button"
               role="tab"
              >
               Home
              </button>
          </li>

          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="draw-tab"
              data-bs-toggle="tab"
              data-bs-target="#draw"
              type="button"
              role="tab"
            >
              Draw
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="patterns-tab"
              data-bs-toggle="tab"
              data-bs-target="#patterns"
              type="button"
              role="tab"
            >
              Patterns
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="figures-tab"
              data-bs-toggle="tab"
              data-bs-target="#figures"
              type="button"
              role="tab"
            >
              Figures
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="gallery-tab"
              data-bs-toggle="tab"
              data-bs-target="#gallery"
              type="button"
              role="tab"
            >
              Gallery
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="utilities-tab"
              data-bs-toggle="tab"
              data-bs-target="#utilities"
              type="button"
              role="tab"
            >
              Utilities
            </button>
          </li>
        </ul>
      </div>

      <div id="content">
        <div id="control">
          <div id="button">
            <button id="commandsButton" class="cmdButton" type="button">
              Commands </button>
          </div>

      <div id="buttonSeparator"></div>

          <div id="action">TBD</div>
        </div>

        <div id="main">
          <div id="subtabs">TBD</div>
          <div id="caption">TBD</div>
          <div id="text">TBD</div>
<div id="sketchpad-wrapper">

    <div id="sketchpad">TBD</div>

    <div id="canvasOverlayLayers">
        <div id="interaction-layer"></div>
        <div id="bbox-layer"></div>
        <div id="nodes-layer"></div>
        <div id="guides-layer"></div>
    </div>

</div>

        <div id="offcanvasPanel" class="offcanvas offcanvas-end" tabindex="-1">
          <div class="offcanvas-header">
            <h6 class="offcanvas-title">TBD</h6>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="offcanvas"
              aria-label="Close"
            ></button>
          </div>
          <div class="offcanvas-body">TBD</div>
        </div>
      </div>
    </div>



  <!-- Overlay Container (Help / Notes / Debug ONLY) -->
<div id="overlayContainer" style="display:none;">
  <div id="overlayBackground"></div>
  <div id="overlayPanel">
    <div id="overlayHeader">
      <span id="overlayTitle"></span>
      <button id="overlayClose">×</button>
    </div>

    <div id="overlayContent">
      <div id="overlay-help"     class="overlay-layer" style="display:none;"></div>
      <div id="overlay-forms"    class="overlay-layer" style="display:none;"></div>
      <div id="overlay-debug"    class="overlay-layer" style="display:none;"></div>
      <div id="overlay-nextprev" class="overlay-layer" style="display:none;"></div>
    </div>
  </div>
</div>


    <!-- Files from the "Draw" side -->
    <script type="module" src="/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
